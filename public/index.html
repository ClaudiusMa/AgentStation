<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Line</title></head><body>
<script src="core.js"></script>
<script>
/* AgentStation: every AI agent on this Mac as passengers on a hand-inked railway (Colorfigures engine, MIT).
   Station = project with an open agent. Closed sessions walk off. Sub-agents follow their parent like a tour group.
   The figure is always one platform (x = depth 100, y = length 210, z = 60): track at the back (low x), platform at
   the front, the train pulls in. Above it, a straight line diagram of every station, like a subway map: click a
   station to go there. The train runs back and forth along that line (asTrain.s, line units, SP between stations).
   Every open agent stands on its platform: an idle one is waiting on the user's feedback, so it still counts as working.
   The agents are commuters: off the train, a moment on the platform, then up the lift or the escalator to work. */
const W = 100, D = 210, H = 60;
// the platform, after the reference: a thin base board (top z = BZ), a deep platform slab (top z = PT) from x = PX0
// to the front, the track sunk in a trench behind it, a back wall, and screen doors along the platform edge
const BZ = 3, PT = 24, PX0 = 40;
// after BART: grey concrete, the brown tile of the Market Street stations, unpainted aluminium cars with the white
// fibreglass nose of the legacy A-car, amber LED boards, black Helvetica signs
const CONC = { l:'#dcd8cf', m:'#c0bbb0', d:'#908a7e' };
const WALL = { l:'#a8775a', m:'#875b42', d:'#593a29' };
const TILE = '#4a2f20';
const SIGN = { l:'#3a3a3a', m:'#262626', d:'#141414' };
const LED = '#161616', LED_TX = '#ffb43a', HAIR = '#2b2420';
const BALLAST = { l:'#cfcac0', m:'#b3ada2', d:'#85806f' };
const TIE = { l:'#c4c1b9', m:'#a7a49c', d:'#77746c' };
const CARM = { l:'#e4e7ea', m:'#bfc6cc', d:'#838c94' };
const NOSE = { l:'#f3f3ee', m:'#d2d3cc', d:'#999a92' };
const WALL_H = 56, NOSE_L = 15;
const HELV = '"Helvetica Neue",Helvetica,Arial,sans-serif';
const txH = (...a) => tx(...a).replace('ui-monospace,Menlo,monospace', HELV).replace('letter-spacing=".04em"', 'letter-spacing=".02em"');
const LEGS = { l:'#5d5852', m:'#45413c', d:'#2c2925' };
const TOOLM = { claude: matOf('#e2774f'), codex: matOf('#5b82d4'), cursor: matOf('#5e5852'), spare: matOf('#d9d2c3') };
const TOOLN = { claude:'CLAUDE', codex:'CODEX', cursor:'CURSOR' };
const HEAD = '#f8e9cf', CABIN = '#3d433f', GLASS = '#cfe6ea';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1' || location.protocol === 'file:';
const SP = 40;                     // line units between neighbouring stations
const POOL = 9;                    // passengers in all: a station's open agents stand on its platform, the rest ride the train

/* ---------- live data ---------- */
let STATIONS = [];                 // [{ project, working, idle, total, s }]
const AGENTS = new Map();          // id -> latest agent record
const PEOPLE = new Map();          // id -> drawn person { id, st, state, x, y, alpha, fade, leader }
let HI = null;                     // the picked session: its passenger stands on a ring, its card is outlined
// what a session is up to, in the three words the whole page uses: busy (working), ask (waiting on you), done (finished, unread)
const kindOf = a => a.status === 'working' ? 'busy' : a.ask ? 'ask' : 'done';
const agentsAt = name => [...PEOPLE.values()].filter(p => p.st === name && p.state === 'platform').map(p => AGENTS.get(p.id)).filter(Boolean);
// one number per open session at the station, stable while it stays open: the oldest is 1 (its platform spot comes first
// too); sub-agents take their parent's number and a letter (1a, 1b…)
function numbering(name = state0.station){
  const here = agentsAt(name), out = new Map();
  const top = here.filter(a => !a.parentId || !here.some(b => b.id === a.parentId)).sort((a, b) => (a.startedAt || 0) - (b.startedAt || 0));
  top.forEach((a, i) => { out.set(a.id, String(i + 1));
    here.filter(k => k.parentId === a.id).sort((x, y) => (x.startedAt || 0) - (y.startedAt || 0)).forEach((k, j) => out.set(k.id, (i + 1) + String.fromCharCode(97 + j))); });
  return out;
}
let LIVE = { mode: DEMO ? 'demo' : 'connecting', at: 0 };

function layoutStations(list){
  const keep = list.slice().sort((a, b) => b.lastActive - a.lastActive).slice(0, 12).sort((a, b) => a.project.localeCompare(b.project));
  STATIONS = keep.map((x, i) => ({ ...x, s: i*SP }));
}
const stationOf = name => STATIONS.find(x => x.project === name);

function applyState(state){
  stripDirty = true;
  LIVE.at = Date.now();
  const seen = new Set();
  // stations: only projects with an open agent (working, or idle and waiting on the user)
  const st = new Map();
  for (const a of state.agents || []){ const x = st.get(a.project); if (!x || a.lastActive > x.lastActive) st.set(a.project, { project: a.project, lastActive: a.lastActive }); }
  const prev = STATIONS.map(x => x.project).join('|');
  layoutStations([...st.values()]);
  if (STATIONS.map(x => x.project).join('|') !== prev){ asTrain.s = mod(asTrain.s, loopLen()); stripDirty = true; }
  if (!stationOf(state0.station) && STATIONS.length){
    const busy = STATIONS.map(x => [x, (state.agents || []).filter(a => a.project === x.project).length]).sort((a, b) => b[1] - a[1]);
    state0.station = busy[0][0].project;
  }
  // the page opens with the train just out of sight to the left of the first station, about to slide in
  if (!asTrain.placed && stationOf(state0.station)){ asTrain.placed = true; const T = asTrain, me = stationOf(state0.station);
    T.s = mod(me.s - SP/2 + .02, loopLen()); T.v = 0; T.dir = 1; T.mode = 'run'; T.at = null; T.target = me.project; }
  for (const a of state.agents || []){
    seen.add(a.id); AGENTS.set(a.id, a);
    let p = PEOPLE.get(a.id);
    if (!p){ p = { id: a.id, st: a.project, state: null, x: 0, y: 0, alpha: 0, fade: 1 }; PEOPLE.set(a.id, p); }
    p.st = a.project; p.fade = 1;
    // an idle session is waiting on the user's feedback, so it still counts as working: everyone open stays on the platform
    if (p.state !== 'platform') toPlatform(p);
  }
  for (const [id, p] of PEOPLE) if (!seen.has(id) && p.state !== 'leaving'){
    p.state = 'leaving'; if (!p.ex) p.fade = -1;               // one already on its way up just finishes going up
  }
}
// an agent opens: it fades in at its spot on the platform
function toPlatform(p){
  if (p.state === null){ p.alpha = 0; p.placeOnNextLayout = true; if (p.st === spareAt && !visit.out) p.arrive = true; }
  p.state = 'platform';
}

/* ---------- the train ---------- */
const CAR_LEN = 180, STOP_Y = D/2 - CAR_LEN/2, DOORS = [30, 80, 130], DOOR_W = 20;
/* The line is a loop: station i sits at i*SP and after the last one the train comes round to the first. It runs
   forward (dir = 1) and stops DWELL seconds at every station; the view is always where the train is, so a page left
   open loops through every project. Previous / Next (or a stop on the line) call the train there the short way round,
   and the view goes with it: it changes only as the train passes each station. */
const asTrain = { s: 0, dir: 1, v: 0, mode: 'run', dwell: 0, t: 0, at: null, target: null, open: 0, placed: false };
const trainAt = () => asTrain.mode === 'dwell' ? asTrain.at : null;
const DWELL = 12;
const loopLen = () => Math.max(1, STATIONS.length)*SP;
const mod = (v, L) => ((v % L) + L) % L;
// signed distance from a to b along the loop, the short way round: in (-L/2, L/2]
const around = (from, to) => { const L = loopLen(); let d = mod(to - from, L); if (d > L/2) d -= L; return d; };
// distance from the train to a point along the loop in its direction of travel, in [-.5, L-.5): a stop the train is
// within half a unit of reads as 0, not as a whole lap away
const aheadOf = (T, p) => mod((p - T.s)*T.dir + .5, loopLen()) - .5;
function nextStop(){
  const T = asTrain;
  if (T.target && stationOf(T.target)) return stationOf(T.target);
  // the stop just left does not count; the one about to be reached does, even in the last half unit
  let best = null, bd = 1e9;
  for (const x of STATIONS){ const d = aheadOf(T, x.s); if (d <= -.5 || (x.project === T.from && d < .5) || d >= bd) continue; bd = d; best = x; }
  return best;
}
// the view is the station the train is standing at; on a run it is the station just behind the train until the
// halfway point, then the next one ahead (whether or not the train will stop there), so every platform sees the
// train slide in from the left and, if it is passing through, out to the right
function syncView(){
  if (!STATIONS.length) return;
  const T = asTrain, L = loopLen();
  let want = T.mode === 'dwell' ? T.at : null;
  if (!want){
    let ahead = null, ad = 1e9, behind = null, bd = 1e9;
    for (const x of STATIONS){
      const d = aheadOf(T, x.s); if (d > .5 && d < ad){ ad = d; ahead = x; }
      const e = mod((T.s - x.s)*T.dir + .5, L) - .5; if (e < bd){ bd = e; behind = x; }
    }
    want = (ahead && ad <= SP/2 ? ahead : behind)?.project;
  }
  if (want && want !== state0.station){ state0.station = want; HI = null; stripDirty = true; figEnter(); }
}
// the figure and its counters ease in when the view moves to the next station (the world slides past the way a
// window seat sees it: left when the train runs right)
function figEnter(){
  for (const id of ['fig', 'stats']){ const el = document.getElementById(id); if (!el) continue;
    el.style.setProperty('--dx', (asTrain.dir*22) + 'px'); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = 'stationin .55s ease-out'; }
}
function tickTrain(dt){
  const T = asTrain, L = loopLen();
  if (T.mode === 'dwell'){
    T.t += dt; T.dwell -= dt;
    // the doors stay open while people are still getting off or on (up to 40 s, so nothing can hold the train for good)
    if (T.at === spareAt && stopBusy(dt) && T.t < 40) T.dwell = Math.max(T.dwell, 2.6);
    T.open = clamp(Math.min(T.t / .6, T.dwell / .6), 0, 1);
    if (T.dwell <= 0){ T.mode = 'run'; T.from = T.at; T.at = null; T.open = 0; }
    syncView();
    return;
  }
  const stop = nextStop(); if (!stop) return;
  if (T.target) T.dir = Math.sign(around(T.s, stop.s)) || 1;      // a called train takes the short way round
  const dist = aheadOf(T, stop.s), express = !!T.target, vmax = express ? 60 : 40;
  T.v = Math.min(vmax, T.v + 30*dt, Math.sqrt(2*28*Math.max(0, dist)) + 2);
  T.s = mod(T.s + T.dir*Math.min(T.v*dt, dist), L);
  if (dist - T.v*dt <= .05){
    T.s = stop.s; T.v = 0; T.dir = 1; T.mode = 'dwell'; T.at = stop.project; T.from = null; T.t = 0; T.dwell = DWELL; T.target = null;
    // every stop here runs the same way: the spares on board get off, wait, and get back on
    if (T.at === spareAt){ visit = { out: false, calm: 0, exit: exitFor(T.at) }; for (const q of SPARES) if (q.state === 'train') q.state = 'riding'; }
  }
  syncView();
}

/* ---------- walking + slots (platform units) ---------- */
const SLOT_Y = [96, 150, 76, 130, 112, 168, 86, 182];   // clear of the escalator's foot and queue (y < 70)
const GAPS = DOORS.map(d => STOP_Y + d + DOOR_W/2);   // where the train's doors (and the screen-door gaps) are
function slotsFor(name){
  const out = new Map(), here = [...PEOPLE.values()].filter(p => p.st === name);
  const plat = here.filter(p => p.state === 'platform' || p.state === 'leaving');
  const ag = id => AGENTS.get(id) || {};
  const leaders = plat.filter(p => !ag(p.id).parentId || !plat.some(q => q.id === ag(p.id).parentId))
    .sort((a, b) => (ag(a.id).startedAt || 0) - (ag(b.id).startedAt || 0));
  leaders.forEach((p, i) => {
    const y = SLOT_Y[i % SLOT_Y.length] + Math.floor(i / SLOT_Y.length)*9, x = 80;
    out.set(p.id, [x, y]);
    plat.filter(q => ag(q.id).parentId === p.id).forEach((c, k) => out.set(c.id, [x + 8*(k % 2 + 1), y + Math.floor(k / 2)*8]));
  });
  return out;
}
/* ---------- the stop: off first, then on ----------
   Every station has POOL people. Picking a station sends the train there with all of them aboard: the station's
   open agents (in their tool's colours) and the spares (grey, POOL less the agents). When the doors open everyone
   gets off; the agents walk to their spots and stay, the spares wait on the boarding marks, then get back on and
   ride away. Picking a station starts this again. */
let SPARES = [], spareAt = null, visit = { out: false, calm: 0 };
const gapNear = y => GAPS.reduce((b, g) => Math.abs(g - y) < Math.abs(b - y) ? g : b);
function queueSpot(i){ const g = GAPS[i % GAPS.length], k = Math.floor(i / GAPS.length); return [54 + 8*Math.floor(k / 2), g + (k % 2 ? 4 : -4)]; }
const arriving = () => [...PEOPLE.values()].filter(p => p.arrive && p.st === spareAt);
function syncSpares(){
  const name = state0.station; if (!name) return;
  const want = Math.max(0, POOL - [...PEOPLE.values()].filter(p => p.st === name && p.state === 'platform').length);
  if (spareAt !== name){
    spareAt = name; SPARES = []; visit = { out: false, calm: 0, exit: exitFor(name) };
    for (const p of PEOPLE.values()){ p.arrive = p.st === name && p.state === 'platform'; if (p.arrive){ p.ex = null; p.z = PT; } }
    Object.assign(lift, { state: 'idle', z: 0, open: 0, t: 0 }); escLast = -1e9;
    if (trainAt() !== name && !asTrain.target) asTrain.target = name;     // the train brings everyone in
    else visit.out = false;
  }
  for (const order of ['waiting', 'riding', 'train']) while (SPARES.length > want){ const i = SPARES.findIndex(q => q.state === order); if (i < 0) break; SPARES.splice(i, 1); }
  while (SPARES.length < want){
    const used = new Set(SPARES.map(q => q.slot)); let slot = 0; while (used.has(slot)) slot++;
    const [x, y] = queueSpot(slot);
    // before the first stop a new spare is aboard with the rest; after it, it turns up on the platform
    SPARES.push({ id: 'spare' + slot, slot, state: visit.out ? 'waiting' : 'riding', x, y, tx: x, ty: y, alpha: visit.out ? 0 : 1, fade: 1 });
  }
}
// while the train stands here: start the walk-off, then send the spares back on once everyone is off and settled
function stopBusy(dt){
  if (asTrain.t < .6) return true;                       // doors still opening
  if (!visit.out){ visit.out = true; let i = 0;
    for (const p of arriving()) p.exitIn = i++*.3;
    for (const q of SPARES) if (q.state === 'riding'){ q.state = 'alighting'; q.exitIn = i++*.3; } }
  const settling = arriving().length || SPARES.some(q => q.state === 'riding' || q.state === 'alighting' || (q.state === 'waiting' && q.moving));
  if (settling){ visit.calm = 0; return true; }
  if (SPARES.some(q => q.state === 'waiting')){ visit.calm += dt; if (visit.calm > .8) for (const q of SPARES) if (q.state === 'waiting') q.state = 'boarding'; return true; }
  if (SPARES.some(q => q.state === 'boarding')) return true;
  // the commuters: the doors stay open until everyone who got off here has gone up to work
  return [...PEOPLE.values()].some(p => p.st === spareAt && p.state === 'platform' && !p.arrive && (!p.ex || p.ex.phase !== 'gone'));
}
// step through a door: appear just inside it, walk out through the gap, then on to where you're going
function stepOff(p, i){ const g = GAPS[i % GAPS.length]; p.x = 30; p.y = g; p.via = [50, g]; p.alpha = 1; p.fade = 1; }
function walk(p, dt, speed){
  const [tx, ty] = p.via || [p.tx, p.ty];
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy), step = speed*dt;
  p.moving = d > .4 || !!p.via; p.walk = (p.walk || 0) + (p.moving ? dt : 0);
  if (d <= step){ p.x = tx; p.y = ty; p.via = null; } else { p.x += dx/d*step; p.y += dy/d*step; }
}
let exitN = 0;

/* ---------- the way out: a lift for a few, an escalator for a crowd ----------
   The agents are commuters. Off the train, a moment on the platform (long enough to read their tags), then up to the
   office. A station has one exit, running off the end of the platform the way a real one leads to the concourse: a
   glass lift tower on a landing past the left end for three or fewer agents, an escalator up past the right end for more. A big sign hangs over it with the project's
   name. They are gone before the train leaves; the next time round they ride in again. A passenger on its way out
   keeps state 'platform' (its card, number and counters stay) and carries p.ex = { via: 'lift' | 'esc', phase, t }. */
const LIFT = { x0: 60, x1: 84, y0: 216, y1: 240, rise: 40, hood: 14, door: [222, 234], land: [56, 210, 94, 242] };
const ESC = { x0: 64, x1: 80, yf: 60, yt: -22, rise: 32, bal: 8, truss: 8 };    // foot on the platform, rising up and away past its right end
const LIFT_FEW = 3, LINGER = 2.4, ESC_T = 4.2, ESC_GAP = .8;
const LIFT_C = [(LIFT.x0 + LIFT.x1)/2, (LIFT.y0 + LIFT.y1)/2], ESC_X = (ESC.x0 + ESC.x1)/2;
const LIFT_SPOTS = [[0, 0], [-4.5, 2.5], [4.5, -2.5], [-4.5, -3.5], [4.5, 3.5]];   // where riders stand in the cab
const lift = { state: 'idle', z: 0, open: 0, t: 0 };            // idle | opening | open | closing | up | top | down
let escLast = -1e9, exitSeq = 0;
const exiting = () => [...PEOPLE.values()].filter(p => p.ex && p.st === spareAt);
const liftBound = () => exiting().filter(p => p.ex.via === 'lift');
// which exit a station has: decided by how many agents it has when the train comes, and kept for the visit
const exitFor = name => [...PEOPLE.values()].filter(p => p.st === name && p.state === 'platform').length <= LIFT_FEW ? 'lift' : 'esc';
const exitOf = name => name === spareAt && visit.exit ? visit.exit : exitFor(name);   // the exit drawn: the visit's, else the count's
const liftEase = u => u < .5 ? 2*u*u : 1 - 2*(1 - u)*(1 - u);
function tickLift(dt){
  const L = lift, bound = liftBound(); L.t += dt;
  if (L.state === 'opening'){ L.open = Math.min(1, L.open + dt/.5); if (L.open >= 1){ L.state = 'open'; L.t = 0; } }
  else if (L.state === 'open'){
    const aboard = bound.some(p => p.ex.phase === 'aboard'), coming = bound.some(p => p.ex.phase === 'to' || p.ex.phase === 'board');
    if ((aboard && (!coming || L.t > 8)) || (!aboard && !coming && L.t > 3)) L.state = 'closing';
  }
  else if (L.state === 'closing'){ L.open = Math.max(0, L.open - dt/.5); if (L.open <= 0){ L.state = bound.some(p => p.ex.phase === 'aboard') ? 'up' : 'idle'; L.t = 0; } }
  else if (L.state === 'up'){ const u = Math.min(1, L.t/3.2); L.z = LIFT.rise*liftEase(u); if (u >= 1){ L.state = 'top'; L.t = 0; } }
  else if (L.state === 'top'){ if (L.t > 1.2){ L.state = 'down'; L.t = 0; } }
  else if (L.state === 'down'){ const u = Math.min(1, L.t/2.6); L.z = LIFT.rise*(1 - liftEase(u)); if (u >= 1){ L.z = 0; L.state = 'idle'; } }
}
// one passenger's way out. linger: stand at the spot a moment. to: walk to the lift door or the foot of the escalator
// (queueing down the platform). ride / in: up the escalator, then through the doorway at the top. board / aboard:
// into the cab, then up with it. gone: upstairs, drawn no more.
function tickExit(p, dt){
  const e = p.ex;
  if (e.phase === 'linger'){ if (!p.moving) e.t += dt; if (e.t < LINGER) return;
    e.phase = 'to'; e.at = ++exitSeq; p.via = null;
    if (e.via === 'lift'){ const n = liftBound().filter(q => q !== p && q.ex.phase !== 'linger' && q.ex.phase !== 'gone').length; e.spot = LIFT_SPOTS[n % LIFT_SPOTS.length]; }
    return;
  }
  if (e.phase === 'to'){
    if (e.via === 'esc'){
      const q = exiting().filter(x => x.ex.via === 'esc' && x.ex.phase === 'to' && x.ex.at < e.at).length;
      p.tx = ESC_X - 2; p.ty = ESC.yf + 2 + 9*q; walk(p, dt, 34);
      if (!q && !p.moving && performance.now() - escLast > ESC_GAP*1000){ escLast = performance.now(); e.phase = 'ride'; e.t = 0; }
    } else {
      p.tx = LIFT.x1 + 6; p.ty = LIFT_C[1] + e.spot[1]*1.3; walk(p, dt, 34);
      if (lift.state === 'idle' && Math.hypot(p.x - LIFT.x1, p.y - LIFT_C[1]) < 36){ lift.state = 'opening'; lift.t = 0; }
      if (!p.moving && lift.state === 'open'){ e.phase = 'board'; p.tx = LIFT_C[0] + e.spot[0]; p.ty = LIFT_C[1] + e.spot[1]; }
    }
  }
  else if (e.phase === 'ride'){ e.t += dt; const u = Math.min(1, e.t/ESC_T);
    p.x = ESC_X; p.y = ESC.yf + (ESC.yt - ESC.yf)*u; p.z = PT + ESC.rise*u; p.moving = false;
    if (u >= 1){ e.phase = 'in'; p.tx = ESC_X; p.ty = ESC.yt - 10; } }
  else if (e.phase === 'in'){ p.z = PT + ESC.rise; walk(p, dt, 30); if (p.y <= ESC.yt - 5) e.phase = 'gone'; }
  else if (e.phase === 'board'){ if (lift.state !== 'open'){ e.phase = 'to'; return; } walk(p, dt, 30); if (!p.moving) e.phase = 'aboard'; }
  else if (e.phase === 'aboard'){ p.z = PT + lift.z + 1; if (lift.state === 'top') e.phase = 'gone'; }
}
function tickSpares(dt){
  syncSpares();
  for (const q of SPARES){
    q.alpha = clamp(q.alpha + q.fade*dt/.8, 0, 1);
    if (q.state === 'alighting'){ q.exitIn -= dt; if (q.exitIn > 0) continue;
      stepOff(q, exitN++); q.state = 'waiting'; [q.tx, q.ty] = queueSpot(q.slot); }
    if (q.state === 'boarding'){
      const g = gapNear(q.y);
      if (asTrain.at !== spareAt){ q.state = 'waiting'; [q.tx, q.ty] = queueSpot(q.slot); }
      else if (Math.abs(q.y - g) > 1.5){ q.tx = 47; q.ty = g; }
      else { q.tx = 26; q.ty = g; if (q.x < 38) q.state = 'train'; }
    }
    if (q.state === 'riding' || q.state === 'train') continue;
    walk(q, dt, 30);
  }
}
function tickPeople(dt){
  tickSpares(dt); tickLift(dt);

    if (p.arrive){                                       // still aboard: steps off once the doors are open
      if (p.state === 'leaving'){ PEOPLE.delete(id); AGENTS.delete(id); continue; }
      if (p.exitIn == null || (p.exitIn -= dt) > 0) continue;
      p.arrive = false; p.exitIn = null; stepOff(p, exitN++); p.placeOnNextLayout = false; p.ex = null; p.z = PT;
    }
    p.alpha = clamp(p.alpha + p.fade*dt/.8, 0, 1);
    if (p.ex){                                           // on its way up to the office
      tickExit(p, dt);
      if (p.ex.phase === 'gone' && p.state === 'leaving'){ PEOPLE.delete(id); AGENTS.delete(id); }
      continue;
    }
    if (p.state === 'leaving'){
      if (asTrain.at === p.st && asTrain.open > .9){
        const g = GAPS.reduce((b, y) => Math.abs(y - p.y) < Math.abs(b - p.y) ? y : b);
        p.fade = 0; p.tx = Math.abs(p.y - g) > 1.5 ? 47 : 26; p.ty = g;
        if (p.x < 38){ PEOPLE.delete(id); AGENTS.delete(id); continue; }
      } else { p.fade = -1; p.tx = p.x + 30; p.ty = p.y; if (p.alpha <= 0){ PEOPLE.delete(id); AGENTS.delete(id); continue; } }
    }

    if (p.state === 'platform' && !p.moving && p.alpha >= 1 && p.st === spareAt && visit.out) p.ex = { via: visit.exit || 'esc', phase: 'linger', t: 0 };

}

    const who = (nums.get(p.id) ? nums.get(p.id) + '  ' : '') + (a.title || 'Untitled session') + (a.ask ? ' — asks: ' + a.ask : a.summary ? ' — ' + a.summary : '');
    return act('ag', `<title>${esc(who)}</title>` + person(p.x, p.y, z, a.tool, { bob, flag: leads, tag, alpha: p.alpha }), `data-id="${esc(p.id)}"`);
  };
  for (const p of onFloor){
    // the picked passenger (or card) stands on a lime ring
    if (p.id === HI){ const ring = pd(on(PZ(PT + .1), ellUV(p.x, p.y, 7.5, 7.5, 18)));
      parts.push({ box: [[p.x - 7.5, p.y - 7.5, PT], [p.x + 7.5, p.y + 7.5, PT + .3]], svg: `<g opacity="${f(.85*p.alpha)}">${fill(ring, 'var(--accent)')}${ink(ring, 1)}</g>` }); }
    parts.push(personPart(p.x, p.y, figure(p)));
  }
  exitsScene(name, parts, figure, here);
  for (const q of spares){ const bob = q.moving ? Math.abs(Math.sin(q.walk*9))*1.2 : 0;
    parts.push(personPart(q.x, q.y, person(q.x, q.y, PT, 'spare', { bob, alpha: q.alpha }))); }
  s += orderParts(parts);

}

// the way out, past the left end of the platform: the lift tower or the escalator, whichever this station has, and a
// big black sign hanging over it with the project's name in white Helvetica over the line's blue band
function exitsScene(name, parts, figure, here){
  const via = exitOf(name);
  const nm = '↑ ' + name.toUpperCase().slice(0, 18);
  // the sign: a board in the air, its face toward us at x, centred on (y, z); it scales with the figure like everything else
  const floatSign = (x, y, z) => { const fs = Math.min(8.5, 66/(nm.length*.6)), w = nm.length*fs*.62 + 10, h = fs*1.9, X = x + .05;
    return { box: [[x - 1.2, y - w/2, z - h/2], [x, y + w/2, z + h/2]],
      svg: box(x - 1.2, y - w/2, z - h/2, x, y + w/2, z + h/2, SIGN, tone, 1.3)
        + fill(pd([[X, y - w/2 + 2, z - h/2 + 1.2], [X, y + w/2 - 2, z - h/2 + 1.2], [X, y + w/2 - 2, z - h/2 + 2.8], [X, y - w/2 + 2, z - h/2 + 2.8]]), 'var(--accent)')
        + txH(X, y, z - fs*.3 + .8, esc(nm), fs, '#f6f3ee', 700) }; };
  if (via === 'esc'){
    // --- the escalator: up from the platform and on past its right end, on a truss over two columns standing on the base
    // board (one under the truss, one under the doorway), into a doorway at the top
    const { x0, x1, yf, yt, rise, bal, truss } = ESC, zt = PT + rise, xi0 = x0 + 1.5, xi1 = x1 - 1.5, X = ESC_X;
    const zd = y => PT + rise*(yf - y)/(yf - yt);                                           // the deck's height along the way
    let s = '';
    // the columns stand on the base board past the platform's end, so they are behind the platform: each sorts on its own,
    // below the deck (so the near balustrade covers its top) and past the platform (so the platform covers its foot)
    for (const y of [-10, yt - 7]) parts.push({ box: [[X - 3, y, BZ], [X + 3, y + 4, PT - .01]],
      svg: box(X - 3, y, BZ, X + 3, y + 4, zd(Math.max(y + 2, yt)) - truss + .5, DARK, tone, .8) });
    s += shape([[xi0, yf, PT], [xi0, yt, zt], [xi0, yt, zt + bal], [xi0, yf, PT + bal]], CONC.m, .8)             // far balustrade, inside
      + shape([[x0, yf, PT + bal], [xi0, yf, PT + bal], [xi0, yt, zt + bal], [x0, yt, zt + bal]], DARK.m, .7)
      + shape([[xi0, yf, PT], [xi1, yf, PT], [xi1, yt, zt], [xi0, yt, zt]], CARM.d, .9);                          // the steps
    for (let y = yf - 2.8; y > yt + 1; y -= 2.8) s += `<path d="${pd([[xi0, y, zd(y)], [xi1, y, zd(y)]], false)}" stroke="${INK}" stroke-width=".5" opacity=".45"/>`;
    const riders = here.filter(p => p.ex && (p.ex.phase === 'ride' || p.ex.phase === 'in')).sort((a, b) => a.y - b.y);
    // through the doorway: whatever is past its face is upstairs and not drawn
    for (const p of riders){ const fig = figure(p); s += p.y < yt + 4 ? clipTo([[p.x, yt, -80], [p.x, yt + 300, -80], [p.x, yt + 300, 300], [p.x, yt, 300]], fig) : fig; }
    // the near side: the balustrade, and under it the truss, solid on the platform then a beam beyond its end
    s += shape([[x1, yf, PT], [x1, 0, PT], [x1, 0, zd(0) - truss], [x1, yt, zt - truss], [x1, yt, zt + bal], [x1, yf, PT + bal]], CONC.l, 1)
      + shape([[xi1, yf, PT + bal], [x1, yf, PT + bal], [x1, yt, zt + bal], [xi1, yt, zt + bal]], DARK.m, .7);
    // the sorting box starts at the platform's surface, so the foot and the steps over the platform draw over it (the columns past
    // its end stand clear of it)
    parts.push({ box: [[x0, yt, PT], [x1, yf, zt + bal]], svg: s });
    // the doorway at the top, a black box on the landing; the sign hangs over it
    const px0 = x0 - 2, px1 = x1 + 2, pz1 = zt + 24;
    parts.push({ box: [[px0, yt - 10, zt - truss], [px1, yt, pz1]], svg: box(px0, yt - 10, zt - truss, px1, yt, pz1, SIGN, tone, 1.1) });
    parts.push(floatSign(x1 + 1, 36, 74));                        // hangs over the lower half, clear of the riders' heads
  } else {
    // --- the lift: the platform runs on a little past its end, and a glass tower stands on that landing, its door toward
    // the front; the cab rises into the hood and the sign hangs over it
    const { x0, x1, y0, y1, rise, hood, door: [d0, d1], land: [lx0, ly0, lx1, ly1] } = LIFT, zt = PT + rise, [cx] = LIFT_C, L = lift, lz = PT + L.z;
    parts.push({ box: [[lx0, ly0, 0], [lx1, ly1, PT]], svg: box(lx0, ly0, 0, lx1, ly1, PT, CONC, tone, 1.4) });
    const pane = pts => `<g opacity=".3">${fill(pd(pts), GLASS)}</g>` + ink(pd(pts), .9);
    for (const [x, y] of [[x0, y0], [x0, y1 - 1], [x1 - 1, y0], [x1 - 1, y1 - 1]]) parts.push({ box: [[x, y, PT], [x + 1, y + 1, zt]], svg: box(x, y, PT, x + 1, y + 1, zt, DARK, tone, .7) });
    // the cab: a floor, the riders on it, a glass rail; cut off where it rises into the hood
    const riders = here.filter(p => p.ex && (p.ex.phase === 'board' || p.ex.phase === 'aboard')).sort((a, b) => (a.x + a.y) - (b.x + b.y));
    let cab = box(x0 + 1.5, y0 + 1.5, lz, x1 - 1.5, y1 - 1.5, lz + 1, CARM, tone, .8);
    for (const p of riders) cab += `<g opacity="${f(.9*p.alpha)}">${personShadow(p.x, p.y, lz + 1)}</g>`;
    for (const p of riders) cab += figure(p);
    cab += `<g opacity=".4">${shape([[x0 + 1.5, y1 - 1.5, lz + 1], [x1 - 1.5, y1 - 1.5, lz + 1], [x1 - 1.5, y1 - 1.5, lz + 8], [x0 + 1.5, y1 - 1.5, lz + 8]], GLASS, .8)}</g>`;
    parts.push({ box: [[x0 + 1.5, y0 + 1.5, Math.min(lz, zt - .02)], [x1 - 1.5, y1 - 1.5, Math.min(lz + 25, zt - .01)]], svg: clipTo([[cx, -60, -80], [cx, 420, -80], [cx, 420, zt], [cx, -60, zt]], cab) });
    // the glass: the two faces we see; the door slides open in the front face, a lamp over it lights while the cab moves
    parts.push({ box: [[x0, y1 - .4, PT], [x1, y1, zt]], svg: pane([[x0 + 1, y1, PT], [x1 - 1, y1, PT], [x1 - 1, y1, zt], [x0 + 1, y1, zt]]) });
    let front = pane([[x1, y0 + 1, PT], [x1, d0, PT], [x1, d0, zt], [x1, y0 + 1, zt]]) + pane([[x1, d1, PT], [x1, y1 - 1, PT], [x1, y1 - 1, zt], [x1, d1, zt]])
      + pane([[x1, d0, PT + 24], [x1, d1, PT + 24], [x1, d1, zt], [x1, d0, zt]]);
    const mid = (d0 + d1)/2, sl = L.open*(d1 - d0)/2, Xd = x1 + .25;
    for (const [a, b] of [[d0, mid - sl], [mid + sl, d1]]) if (b - a > .3){
      front += shape([[Xd, a, PT], [Xd, b, PT], [Xd, b, PT + 24], [Xd, a, PT + 24]], CARM.m, .9);
      if (b - a > 2.6) front += `<g opacity=".35">${fill(pd([[Xd, a + 1, PT + 12], [Xd, b - 1, PT + 12], [Xd, b - 1, PT + 21], [Xd, a + 1, PT + 21]]), GLASS)}</g>`; }
    const lit = L.state === 'up' || L.state === 'down';
    front += shape([[Xd, mid - 2.5, PT + 25], [Xd, mid + 2.5, PT + 25], [Xd, mid + 2.5, PT + 26.6], [Xd, mid - 2.5, PT + 26.6]], lit ? LED_TX : LED, .5);
    parts.push({ box: [[x1 - .4, y0, PT], [x1, y1, zt]], svg: front });
    parts.push({ box: [[x0, y0, zt], [x1, y1, zt + hood]], svg: box(x0, y0, zt, x1, y1, zt + hood, SIGN, tone, 1.1) });
    parts.push(floatSign(x1 + 1, LIFT_C[1], zt + hood + 14));
  }
}

  if (!atStop || list._left === state0.station) return;
  const here = agentsAt(state0.station), nums = numbering();
  const top = here.filter(a => !a.parentId || !here.some(b => b.id === a.parentId)).sort((a, b) => (a.startedAt || 0) - (b.startedAt || 0));
  const kidsOf = a => here.filter(k => k.parentId === a.id).sort((x, y) => (x.startedAt || 0) - (y.startedAt || 0));
  const badge = a => `<span class="badge" title="passenger ${nums.get(a.id) || ''} on the platform">${nums.get(a.id) || ''}</span>`;
  const tool = a => TOOLN[a.tool] ? TOOLN[a.tool][0] + TOOLN[a.tool].slice(1).toLowerCase() : '';
  const meta = a => `<i style="background:${(TOOLM[a.tool] || TOOLM.cursor).l}"></i>${tool(a)}${a.model ? ' · ' + esc(a.model.replace(/^claude-/, '').replace(/-\d+(-\d+)*$/, '')) : ''} · ${ago(a.lastActive)}`;
  const dots = '<span class="working"><i></i><i></i><i></i></span>';
  const head = (a, extra = '') => `<div class="head"><div class="hd"><h3 class="ttl">${esc(a.title || 'Untitled session')}</h3><div class="meta">${extra}${meta(a)}</div></div>${badge(a)}</div>`;
  const kids = a => { const k = kidsOf(a); return k.length ? `<ul class="kids"><li class="lbl">${k.length} sub-agent${k.length > 1 ? 's' : ''} working for it</li>` + k.map(x =>
    `<li data-id="${esc(x.id)}"${x.id === HI ? ' class="hi"' : ''}>${dots}<span>${esc(x.title)}</span>${badge(x)}</li>`).join('') + '</ul>' : ''; };
  const cls = (a, base) => `${base}${a.id === HI ? ' hi' : ''}`;
  const asks = top.filter(a => kindOf(a) === 'ask'), busy = top.filter(a => kindOf(a) === 'busy'), done = top.filter(a => kindOf(a) === 'done');
  let html = '';
  if (!top.length) html = `<p class="lead"%D%>No open sessions at this station.</p>`;
  if (asks.length) html += `<div class="grp"%D%>Waiting · ${asks.length}</div>` + asks.map(a => { const parts = askParts(a.ask);
    return `<article class="${cls(a, 'card')}" data-id="${esc(a.id)}"%D%>${head(a)}`
      + (parts ? `<ul class="q">${parts.map(x => `<li>${esc(upFirst(x))}</li>`).join('')}</ul>` : `<p class="q">${esc(upFirst(a.ask))}</p>`)
      + kids(a) + `</article>`; }).join('');
  if (busy.length) html += `<div class="grp"%D%>Working · ${busy.length}</div>` + busy.map(a =>
    `<article class="${cls(a, 'card')}" data-id="${esc(a.id)}"%D%>${head(a, dots)}`
    + `<p class="now"><b>Now:</b> ${a.summary ? esc(upFirst(a.summary)) : 'working, no update yet'}</p>` + kids(a) + `</article>`).join('');
  if (done.length) html += `<div class="grp"%D%>Finished, read when you can · ${done.length}</div><div class="rows">` + done.map(a =>
    `<div class="${cls(a, 'row')}" data-id="${esc(a.id)}"%D%><span class="ttl">${esc(a.title || 'Untitled session')}</span><span class="last" title="${esc(a.summary || '')}">${esc(upFirst(a.summary || ''))}</span><span class="when">${ago(a.lastActive)}</span>${badge(a)}</div>`).join('') + `</div>`;
  if (list._h !== html){
    const fresh = list._st !== state0.station; let k = 0;
    list._h = html; list._st = state0.station;
    list.innerHTML = fresh ? html.replace(/%D%/g, () => ` style="animation-delay:${(.9 + .4*k++).toFixed(2)}s"`) : html.replace(/%D%/g, '');
    list.querySelectorAll(':scope > .rows').forEach(el => { el.style.animationDelay = el.firstElementChild?.style.animationDelay || '0s'; });  // the box comes with its first row
    if (fresh) requestAnimationFrame(() => { list.style.transition = 'min-height .7s ease'; list.style.minHeight = '0px'; });
    list.classList.remove('settled'); clearTimeout(list._settle);
    if (fresh) list._settle = setTimeout(() => list.classList.add('settled'), (.9 + .4*k + .6)*1000); else list.classList.add('settled');
  }
}
list.addEventListener('click', e => { const c = e.target.closest('[data-id]'); if (c) pick(c.dataset.id); });
const r0 = ui.render;
ui.render = () => {
  r0();
  if (stripDirty || performance.now() - (strip._t || 0) > 1000){ stripDirty = false; strip._t = performance.now(); drawStrip(); drawList(); }
  // the little train slides along the rail every frame
  const trn = strip.querySelector('.trn'), n = STATIONS.length;
  if (trn){ const u = asTrain.s/SP; let pct;
    if (n < 2) pct = 50; else if (u <= n - 1) pct = 6 + 88*u/(n - 1); else { const t = u - (n - 1); pct = t < .5 ? 94 + t*36 : -12 + (t - .5)*36; }
    if (trn._p !== pct){ trn._p = pct; trn.style.left = pct + '%'; trn.style.visibility = pct < 2 || pct > 98 ? 'hidden' : ''; } }
  h1.textContent = `Fig. 01 — ${state0.station || 'Agent Line'} platform`;
  // the server only sends when something changes, so a quiet stream is still live while its connection is open
  const status = LIVE.mode === 'demo' ? 'demo data' : LIVE.mode === 'live' && LIVE.es && LIVE.es.readyState !== 1 ? 'reconnecting' : LIVE.mode;
  const html = Object.entries(TOOLN).map(([k, n]) => `<i style="background:${TOOLM[k].l}"></i>${n.toLowerCase()}`).join('') + `<i style="background:${status === 'live' ? '#43c25c' : status === 'demo data' ? '#f4b829' : '#e2483d'}"></i>${status}`;
  if (key._h !== html){ key._h = html; key.innerHTML = html; }
};

let paused = false;
// the engine caps a frame at 0.05 s; the trains and people run on real time instead (capped at 0.25 s), so a slow
// or throttled page still keeps pace
let lastTick = 0;
const tick = () => { if (document.hidden){ paused = true; lastTick = 0; return false; }
  const now = performance.now(), dt = lastTick ? Math.min(.25, (now - lastTick)/1000) : 0; lastTick = now;
  tickTrain(dt); tickPeople(dt); return true; };
document.addEventListener('visibilitychange', () => { if (!document.hidden && paused){ paused = false; ui.animate(tick); } });
ui.animate(tick);

/* ---------- feed: the local server's stream, or made-up agents for a demo ---------- */
if (DEMO) startDemo(); else connect();
function connect(){
  fetch('/api/state').then(r => r.json()).then(s => { LIVE.mode = 'live'; applyState(s); }).catch(() => { LIVE.mode = 'offline'; });
  const es = LIVE.es = new EventSource('/api/stream');
  es.onmessage = e => { LIVE.mode = 'live'; applyState(JSON.parse(e.data)); };
  es.onerror = () => { LIVE.mode = 'reconnecting'; };
  setInterval(() => { if (LIVE.mode === 'live' && Date.now() - LIVE.at > 1000) ui.render(); }, 5000);
}
function startDemo(){
  const projects = ['Atlas', 'Beacon', 'Cedar', 'Delta', 'Ember', 'Fjord'];
  const titles = ['Fix sync conflict on profile', 'Write onboarding copy', 'Refactor map renderer', 'Review planning.md', 'Add QR sharing', 'Ingest Kosa chat', 'Guardian review', 'Tune train easing', 'Draft thesis outline', 'Migrate CloudKit schema'];
  const tools = ['claude', 'claude', 'codex', 'cursor'];
  const nows = ['Tests pass; writing the handoff', 'Reading the renderer before touching it', 'Two of three screens done', 'Waiting on the build', 'Drafting the copy, second pass'];
  const asks = ['Approve the migration plan before I run it', 'Which of the two layouts do you want?', 'OK to push to main? Tests pass. Then tell me whether to open the PR', null];
  const dones = ['Merged into main; nothing pushed', 'Deck deployed as a private artifact', 'Handoff written and committed'];
  let n = 0; const agents = [];
  const add = (parent) => { const p = parent ? parent.project : projects[(Math.random()*projects.length)|0], busy = Math.random() < .55 || parent, ask = !busy && Math.random() < .6 ? asks[n % asks.length] : null;
    agents.push({ id: 'demo' + (++n), tool: parent ? parent.tool : tools[(Math.random()*tools.length)|0], title: parent ? titles[n % titles.length] : titles[n % titles.length], project: p, cwd: '~/' + p,
      status: busy ? 'working' : 'idle', parentId: parent ? parent.id : null, startedAt: Date.now() - n*1000, lastActive: Date.now() - (busy ? 0 : n*7e5),
      summary: busy ? nows[n % nows.length] : ask ? 'Plan written; see the lane' : dones[n % dones.length], ...(ask && { ask }) }); };
  for (let i = 0; i < 11; i++) add();
  agents[0].status = 'working'; agents[0].summary = nows[0]; delete agents[0].ask;
  add(agents[0]); add(agents[0]); add(agents[2]);
  const push = () => applyState({ agents: agents.slice(), stations: projects.map(p => ({ project: p, lastActive: Date.now() })) });
  push();
  setInterval(() => {
    const r = Math.random(), a = agents.filter(x => !x.parentId)[(Math.random()*agents.length)|0];
    if (r < .45 && a){ const busy = a.status !== 'working'; a.status = busy ? 'working' : 'idle'; a.summary = busy ? nows[(Math.random()*nows.length)|0] : dones[(Math.random()*dones.length)|0]; delete a.ask; if (!busy && Math.random() < .5) a.ask = asks[(Math.random()*3)|0]; }
    else if (r < .65) add();
    else if (r < .78 && a) add(a);
    else if (agents.length > 6){ const i = (Math.random()*agents.length)|0; agents.splice(i, 1); }
    for (let i = agents.length - 1; i >= 0; i--) if (agents[i].parentId && !agents.some(x => x.id === agents[i].parentId)) agents.splice(i, 1);
    push();
  }, 3500);
}
